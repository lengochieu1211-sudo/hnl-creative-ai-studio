name: Sync Lockfile Metadata
on:
  push:
    paths:
      - '.github/workflows/sync-lock-version.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync package-lock version metadata
        run: npm version 1.1.1 --no-git-tag-version --allow-same-version
      - name: Commit lockfile metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Lockfile metadata already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: sync package-lock metadata for v1.1.1"
          git push origin HEAD:main
